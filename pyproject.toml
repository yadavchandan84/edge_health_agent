[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-health-agent"
version = "1.0.0"
description = "Single-process health agent for unattended edge boxes: metrics, probes, alerts, API and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
healthagent = "healthagent.__main__:main"

[tool.setuptools]
packages = ["healthagent", "healthagent.collectors"]

[tool.setuptools.package-data]
healthagent = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["B008"]
